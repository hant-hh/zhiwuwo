openapi: 3.1.0
info:
  title: 置物窝 API
  version: 0.1.0
paths:
  /api/v1/auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/records:
    post:
      tags:
      - records
      summary: Create Record
      operationId: create_record_api_v1_records_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - records
      summary: List Records
      operationId: list_records_api_v1_records_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecordResponse'
                title: Response List Records Api V1 Records Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/records/{record_id}/confirm:
    post:
      tags:
      - records
      summary: Confirm Record
      operationId: confirm_record_api_v1_records__record_id__confirm_post
      security:
      - HTTPBearer: []
      parameters:
      - name: record_id
        in: path
        required: true
        schema:
          type: integer
          title: Record Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/parser/status:
    get:
      tags:
      - parser
      summary: Parser Status
      description: 查看当前生效的解析器与 AI 配置状态，用于启动后自检。
      operationId: parser_status_api_v1_parser_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/chat:
    post:
      tags:
      - chat
      summary: Chat
      operationId: chat_api_v1_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ChatRequest:
      properties:
        message:
          type: string
          title: Message
        mode:
          type: string
          title: Mode
          default: auto
      type: object
      required:
      - message
      title: ChatRequest
    ChatResponse:
      properties:
        type:
          type: string
          title: Type
        intent:
          type: string
          title: Intent
        answer:
          type: string
          title: Answer
        record:
          anyOf:
          - $ref: '#/components/schemas/RecordResponse'
          - type: 'null'
        records:
          items:
            $ref: '#/components/schemas/RecordResponse'
          type: array
          title: Records
      type: object
      required:
      - type
      - intent
      - answer
      title: ChatResponse
    ConfirmRequest:
      properties:
        item:
          anyOf:
          - type: string
          - type: 'null'
          title: Item
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        placed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Placed At
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      type: object
      title: ConfirmRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    RecordCreate:
      properties:
        content:
          type: string
          title: Content
        modality:
          type: string
          title: Modality
          default: text
      type: object
      required:
      - content
      title: RecordCreate
    RecordResponse:
      properties:
        id:
          type: integer
          title: Id
        item:
          anyOf:
          - type: string
          - type: 'null'
          title: Item
        location:
          anyOf:
          - type: string
          - type: 'null'
          title: Location
        placed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Placed At
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        confidence:
          type: number
          title: Confidence
        confirmed:
          type: boolean
          title: Confirmed
        needs_confirm:
          type: boolean
          title: Needs Confirm
      type: object
      required:
      - id
      - confidence
      - confirmed
      - needs_confirm
      title: RecordResponse
    RegisterRequest:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          title: Password
        nickname:
          anyOf:
          - type: string
          - type: 'null'
          title: Nickname
      type: object
      required:
      - username
      - password
      title: RegisterRequest
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      title: TokenResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
