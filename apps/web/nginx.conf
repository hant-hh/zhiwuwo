# HTTP 明文站点，容器内固定监听 18080；对外端口由 start.sh 的 WEB_PORT 决定
# 不再监听 80/8080：公网 80 仅在签发证书时由 issue-cert.sh 临时开放，
# 用于 Let's Encrypt HTTP-01 验证（该 challenge 硬性要求公网 80）。
server {
    listen 18080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ACME 挑战目录（由 start.sh 挂载 deploy/certbot/www 到 /var/www/certbot）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把 /api 转发到同网络下的 api 容器（8000 端口）
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查与契约导出也走域名（App 登录页「测试连接」会用 /health）
    location = /health {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }
}
