# HTTPS 站点（由 start.sh 挂载到 /etc/nginx/conf.d/https.conf）
# 证书路径与 Let's Encrypt 标准目录一致：/etc/letsencrypt/live/<DOMAIN>/
# 首次启动由 deploy/init-certs.sh 生成自签占位证书，域名解析生效后
# 运行 deploy/issue-cert.sh 换成正式证书并 reload。
# 监听非常用端口 18443（由 start.sh 映射到对外 WEB_HTTPS_PORT）
# 非标准 HTTPS 端口需在 URL 中显式写出：https://zhiwuwo.com:18443
server {
    listen 18443 ssl;
    server_name zhiwuwo.com www.zhiwuwo.com;

    ssl_certificate /etc/letsencrypt/live/zhiwuwo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zhiwuwo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 移动端上传媒体时放宽请求体大小（M2 预留）
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代 API，移动端与 Web 都无需处理跨域
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 健康检查与契约导出（App 登录页「测试连接」会用 /health）
    location = /health {
        proxy_pass http://api:8000;
    }

    location = /openapi.json {
        proxy_pass http://api:8000;
    }
}
